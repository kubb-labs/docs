name: Check version pins

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-version-pins.sh'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/check-version-pins.sh
