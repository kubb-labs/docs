name: Refresh Context7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        # Skipped until the library is registered on context7.com and the key is added.
        if: env.CONTEXT7_API_KEY != ''
        run: |
          curl -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/${{ github.repository }}"}'
